<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>


      <a-sphere  phi-start = "0" phi-length = "320" side = "double" rotation = "90 0 0" position = "0 1 0" color = "yellow"></a-sphere>
      <a-sphere  radius = "0.1" position = "-0.3 1.5 0.9" color = "black"></a-sphere>
      <a-sphere  radius = "0.1" position = "-0.3 1.5 -0.9" color = "black"></a-sphere>




      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
