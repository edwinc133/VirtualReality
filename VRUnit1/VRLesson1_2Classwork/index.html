<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-box position="-1 1.5 -3" rotation="0 90 0" color="#4CC3D9"></a-box>
      <a-box position="-10 3.5 -3" rotation="0 90 0" height="7" color="#110D1D"></a-box>
      <a-box position="-15 3.5 -3" rotation="0 90 0" height="7" color="#110D1D"></a-box>
      <a-box position="-12.5 6.5 -3" rotation="90 90 0" height="6" color="#110D1D"></a-box>
      <a-box position="-12.5 0.5 -3" rotation="90 90 0" height="6" color="#110D1D"></a-box>
      <a-box position="-12.5 3.5 -3" rotation="180 180 0" width="4" height="5" color="#5E1C9E"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere position="5 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere position="-5 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-cylinder position="1 0.75 -2" radius="0.5" height="1" color="#FFC65D"></a-cylinder>
      <a-cylinder position="1 0.75 -1" radius="0.5" height=".5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
